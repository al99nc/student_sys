services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/db:/app/db
      - ./frontend/HOW_TO_USE.md:/app/HOW_TO_USE.md:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_KEYS=${AI_API_KEYS}
      - AI_MODEL=${AI_MODEL:-openai/gpt-oss-120b}
      - DATABASE_URL=sqlite:////app/db/students.db
      - UPLOAD_DIR=uploads
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BOT_SECRET=${BOT_SECRET:-themcq-bot-secret-2026}
      - CHECKOUT_SECRET_KEY=${CHECKOUT_SECRET_KEY:-}
      - CHECKOUT_WEBHOOK_SECRET=${CHECKOUT_WEBHOOK_SECRET:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
      - CREDIT_PRICE_CENTS=${CREDIT_PRICE_CENTS:-100}
      - CHECKOUT_CURRENCY=${CHECKOUT_CURRENCY:-usd}
      - CREDIT_COST_MCQ_PROCESS=${CREDIT_COST_MCQ_PROCESS:-1}
      - CREDIT_COST_COACH_MESSAGE=${CREDIT_COST_COACH_MESSAGE:-1}
      - open_rout_PAID_API_KEY=${open_rout_PAID_API_KEY}
      - open_rout_PAID_MODEL=${open_rout_PAID_MODEL:-google/gemini-2.5-flash}
      - CHAT_AI_MODEL=${CHAT_AI_MODEL:-llama-3.1-8b-instant}
      - CHAT_AI_API_KEY=${CHAT_AI_API_KEY}
      - WAYL_API_KEY=${WAYL_API_KEY}
      - WAYL_API_BASE_URL=${WAYL_API_BASE_URL:-https://api.thewayl.com}
      - WAYL_WEBHOOK_SECRET=${WAYL_WEBHOOK_SECRET}
      - CREDIT_PRICE_IQD=${CREDIT_PRICE_IQD:-250}

  bot:
    build: ./bot
    restart: always
    volumes:
      - ./bot/sessions:/app/sessions
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME:-themcq_bot}
      - OWNER_ID=${OWNER_ID}
      - MINI_APP_URL=${MINI_APP_URL:-https://themcq.xyz/upload}
      - BACKEND_URL=http://84.235.244.210:8000/
      - BOT_SECRET=${BOT_SECRET:-themcq-bot-secret-2026}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://84.235.244.210:8000/
    ports:
      - "3000:3000"
    depends_on:
      - backend
